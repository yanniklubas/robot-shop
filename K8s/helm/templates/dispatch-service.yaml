# dispatch just listens to a message queue
# it does not expose any ports
apiVersion: v1
kind: Service
metadata:
  name: dispatch
  labels:
    service: dispatch
spec:
  {{- if .Values.topologyAwareServices }}
  trafficDistribution: PreferClose
  {{- end }}
  clusterIP: None
  ports:
  - name: headless
    port: 55555
    targetPort: 0
  - name: health
    port: 8080
    targetPort: 8080
  selector:
    service: dispatch
