apiVersion: v1
kind: Service
metadata:
  labels:
    service: catalogue
  name: catalogue
  {{- if .Values.topologyAwareServices }}
  annotations:
    service.kubernetes.io/topology-mode: "Auto"
  {{- end }}
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    service: catalogue
