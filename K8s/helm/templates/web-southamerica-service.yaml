apiVersion: v1
kind: Service
metadata:
  name: web-southamerica
  labels:
    service: web
    region: southamerica
  {{- if .Values.topologyAwareServices }}
  annotations:
    service.kubernetes.io/topology-mode: "Auto"
  {{- end }}
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    service: web
    region: southamerica
  {{ if .Values.nodeport }}
  type: NodePort
  {{ else }}
  type: LoadBalancer
  {{ end }}
---
{{if .Values.ocCreateRoute}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web
spec:
  to:
    kind: Service
    name: web
{{end}}
