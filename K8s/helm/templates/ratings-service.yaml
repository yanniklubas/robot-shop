apiVersion: v1
kind: Service
metadata:
  name: ratings
  labels:
    service: ratings
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
  selector:
    service: ratings
    {{ if .Values.topologyAwareServices }}
    topologyKeys:
    - "topology.kubernetes.io/region"
    - "*"
    {{ end }}
