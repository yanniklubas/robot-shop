apiVersion: v1
kind: Service
metadata:
  labels:
    service: mongodb
  name: mongodb
  {{- if .Values.topologyAwareServices }}
  annotations:
    service.kubernetes.io/topology-mode: "Auto"
  {{- end }}
spec:
  ports:
  - name: mongo
    port: 27017
    targetPort: 27017
  selector:
    service: mongodb
