apiVersion: v1
kind: Service
metadata:
  labels:
    service: mongodb
  name: mongodb
spec:
  ports:
  - name: mongo
    port: 27017
    targetPort: 27017
  selector:
    service: mongodb
    {{ if .Values.topologyAwareServices }}
    topologyKeys:
    - "topology.kubernetes.io/region"
    - "*"
    {{ end }}
